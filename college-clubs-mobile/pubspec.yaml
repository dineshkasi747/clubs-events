name: college_clubs_mobile
description: "A premium native Flutter mobile application to coordinate college student clubs, browse historical events year-wise, register for paid upcoming events, and receive Firebase push notifications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
